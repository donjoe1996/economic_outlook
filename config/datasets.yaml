# ---------------------------------------------------------------------------
# Datasets: the ONE place that says where every number on the page comes from.
#
# Each entry is one dataset the page reads with dash.data('<id>').
#
#   range   Google Sheet tab and cells, A1 notation.
#             Open-ended  (PMI!A2:G)       -> reads to the bottom of the tab.
#             Fixed       ('Tab'!A17:G28)  -> reads exactly that block; use it
#                                             when one tab holds several tables.
#           The row just above the range is read as the column names.
#   file    A local file instead of a Sheet (e.g. map shapes).
#   write   What the "Tambah / perbarui data" form may do:
#             append  add a new period at the bottom, or update an existing one
#                     (needs an open-ended range)
#             fill    only update rows already inside the range (fills blanks)
#             none    read-only (formula-driven tabs, one-off snapshots)
#   key     Column(s) (0 = first column of the range) that identify a row.
#           Usually the period. A list makes a composite key.
#   updater Optional automatic fetcher (see backend/updaters/).
#   group   macro (default, loaded by the dashboard) or stock (loaded by
#           stock.html). Keeps 3,000-row price tables off the dashboard.
#
# Publishing schedule (for the Metadata page, backend/freshness.py):
#   frequency         monthly | quarterly | irregular | snapshot | static
#   lag_days          days after a period ends until it is usually published.
#                     ASSUMPTIONS: approximate, check them against the
#                     publisher's release calendar (BPS, BI, OJK, ...).
#   stale_after_days  for irregular data: older than this = needs an update
#   period_col        column holding the period/date (default: the key column)
#   value_col         column whose blanks count as missing data (default 1)
#   release, release_url, note   shown on the Metadata page
#
# Adding an indicator = add an entry here + a loader in
# frontend/js/data/loaders.js + a drawing in frontend/js/sections/.
# ---------------------------------------------------------------------------

spreadsheet_id: "1L5maHUBilVeH5Uf3IOKJ4A1dHLWr8IqeyXqHE-UbEyw"

