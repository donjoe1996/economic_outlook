  # ---------------- World and US ----------------------------------------------
  gpmi:
    title: PMI Manufaktur Global bulanan
    description: J.P. Morgan Global Manufacturing PMI bulanan (50 = batas ekspansi), dengan penerbit, URL sumber, dan tingkat kepercayaan.
    range: "'PMI Global'!A2:G"
    write: append

  cpmi:
    title: PMI China bulanan
    description: PMI manufaktur resmi China (NBS) bulanan.
    range: "'PMI China'!A2:G"
    write: append

  ism:
    title: ISM PMI Manufaktur AS bulanan
    description: ISM Manufacturing PMI Amerika Serikat bulanan dengan penerbit, URL sumber, kepercayaan.
    range: "'ISM AS'!A2:G"
    write: append

  fed:
    title: Fed Funds Rate bulanan
    description: Target federal funds rate AS (Federal Reserve), posisi akhir bulan, dengan penerbit, URL sumber, dan tingkat kepercayaan.
    range: "'Fed Funds'!A2:I"
    write: append
    updater:
      type: fred
      frequency: monthly       # one row per calendar month
      aggregate: last          # value on the last day of the month
      columns:                 # Sheet column -> FRED series id
        B: DFEDTARU            # upper limit of the target range
        H: DFEDTARL            # lower limit
      mean:                    # derived column = average of other columns
        I: [B, H]
      static:                  # fixed text written into every new row
        C: "% (posisi akhir bulan)"
        D: "Federal Reserve (via FRED, St. Louis Fed)"
        E: "https://fred.stlouisfed.org/series/DFEDTARU"
        F: "Tinggi"
        G: "Otomatis dari FRED (DFEDTARU, DFEDTARL)"

  gdpus:
    title: PDB riil AS kuartalan
    description: PDB riil AS (QoQ, laju tahunan) per kuartal dengan sumber dan kepercayaan.
    range: "'PDB AS'!A2:G"
    write: append
    updater:
      type: fred
      frequency: quarterly
      aggregate: last
      columns:
        B: A191RL1Q225SBEA     # real GDP, % change from preceding quarter, SAAR
      static:
        C: "% (annualized, SAAR)"
        D: "Bureau of Economic Analysis (BEA), via FRED"
        E: "https://fred.stlouisfed.org/series/A191RL1Q225SBEA"
        F: "Sedang"
        G: "Otomatis dari FRED. Estimasi BEA masih bisa direvisi"

