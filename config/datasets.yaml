  # creates "IEO Saham" in your Drive when you add the first stock and keeps its
  # id in data/spreadsheets.local.json. Put an id here to use an existing sheet.
  saham: ""

# Stocks with their own spreadsheets, from before the shared Saham sheet.
# Every other stock is a row in the Saham sheet's Daftar tab.
stocks_legacy:
