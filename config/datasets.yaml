# Other spreadsheets, by a short name. A dataset picks one with
# "spreadsheet: <name>"; without it, the main spreadsheet above is used.
spreadsheets:
  main: "1L5maHUBilVeH5Uf3IOKJ4A1dHLWr8IqeyXqHE-UbEyw"
  bmri: "1Oj0CbbXxoWlnUqvdeJMM0BEj3OvUreBvr3kMsPGYTIs"        # "BMRI prices (live)"
  bank_peers: "1K3q7sd97i9N5iatpSPp-w4NToFAMTapljOMYwq96ArA"  # "IDX bank peers prices (live)"
