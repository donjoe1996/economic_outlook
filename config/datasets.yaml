    release_url: "https://fred.stlouisfed.org/series/A191RL1Q225SBEA"
    write: append
    updater:
      type: fred
      frequency: quarterly
      aggregate: last
      columns:
        B: A191RL1Q225SBEA     # real GDP, % change from preceding quarter, SAAR
      static:
        C: "% (annualized, SAAR)"
        D: "Bureau of Economic Analysis (BEA), via FRED"
        E: "https://fred.stlouisfed.org/series/A191RL1Q225SBEA"
        F: "Sedang"
